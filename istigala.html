<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة مكافأة نهاية الخدمة عند الاستقالة 2025 - كم استحق؟</title>
<meta name="description" content="احسب مكافأة نهاية الخدمة عند الاستقالة حسب نظام العمل السعودي الجديد. هل تستحق ثلث أو ثلثين أو كامل المكافأة؟ احسب الآن.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9356692145273804" crossorigin="anonymous"></script>
<style>body{font-family:tahoma;background:#f8f9fa;margin:0;padding:20px}.container{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:15px}h1{color:#b71c1c;text-align:center}button{background:#b71c1c;color:#fff;padding:12px;width:100%;border:none;border-radius:8px;font-size:18px}</style>
</head>
<body>
<div class="container">
<h1>حاسبة الاستقالة - مكافأة نهاية الخدمة عند الاستقالة</h1>
<p>حسب نظام العمل السعودي، مكافأتك عند الاستقالة تختلف:</p>
<ul style="line-height:2">
<li><b>أقل من سنتين:</b> لا تستحق مكافأة</li>
<li><b>من سنتين لـ 5 سنوات:</b> تستحق ثلث المكافأة</li>
<li><b>من 5 لـ 10 سنوات:</b> تستحق ثلثي المكافأة</li>
<li><b>أكثر من 10 سنوات:</b> تستحق كامل المكافأة</li>
</ul>
<div style="background:#fff3e0;padding:20px;border-radius:10px;margin:20px 0">
<label>راتبك الأخير</label><input type="number" id="s" style="width:100%;padding:10px;margin:5px 0">
<label>سنوات الخدمة</label><input type="number" id="y" style="width:100%;padding:10px;margin:5px 0">
<button onclick="c()">احسب مكافأة استقالتي</button>
<div id="r" style="display:none;margin-top:15px;font-weight:bold;background:#ffebee;padding:15px;border-radius:8px;text-align:center"></div>
</div>
<p><a href="/">← ارجع للحاسبة الرئيسية</a></p>
</div>
<script>
function c(){
let s=parseFloat(document.getElementById('s').value);
let y=parseFloat(document.getElementById('y').value);
if(!s||!y)return alert('عبي البيانات');
let total=y<=5?(s/2)*y:(s/2)*5+s*(y-5);
let m=0;if(y<2)m=0;else if(y<5)m=total/3;else if(y<10)m=total*2/3;else m=total;
document.getElementById('r').style.display='block';
document.getElementById('r').innerHTML='مكافأتك عند الاستقالة: '+Math.round(m).toLocaleString()+' ريال<br><small>المكافأة الكاملة: '+Math.round(total).toLocaleString()+' ريال</small>';
}
</script>
</body>
</html>
